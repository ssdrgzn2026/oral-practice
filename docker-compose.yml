services:
  mischub:
    build:
      context: .
      dockerfile: Dockerfile
    image: mischub:latest
    container_name: mischub
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      - TZ=Asia/Shanghai
      - FLASK_HOST=0.0.0.0
      - FLASK_PORT=5000
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - OPENAI_MODEL=${OPENAI_MODEL:-Qwen/Qwen3-8B}
      - OPENAI_WHISPER_MODEL=${OPENAI_WHISPER_MODEL:-FunAudioLLM/SenseVoiceSmall}
    volumes:
      - ./口语AI伴侣/data:/app/口语AI伴侣/data
      - ./stats:/app/stats

  mischub-convert:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    image: mischub-streamlit:latest
    container_name: mischub-convert
    restart: unless-stopped
    ports:
      - "127.0.0.1:8501:8501"
    command: >
      streamlit run 格式转换系统/app.py
      --server.port=8501
      --server.address=0.0.0.0
      --server.baseUrlPath=convert
      --server.enableCORS=false
      --server.enableXsrfProtection=false
      --server.maxUploadSize=200
      --browser.gatherUsageStats=false

  mischub-dcf:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    image: mischub-streamlit:latest
    container_name: mischub-dcf
    restart: unless-stopped
    ports:
      - "127.0.0.1:8502:8502"
    command: >
      streamlit run DCF估值分析系统/streamlit_app.py
      --server.port=8502
      --server.address=0.0.0.0
      --server.baseUrlPath=dcf
      --server.enableCORS=false
      --server.enableXsrfProtection=false
      --browser.gatherUsageStats=false
