services:
  mischub:
    build:
      context: .
      dockerfile: Dockerfile
    image: mischub:latest
    container_name: mischub
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      - TZ=Asia/Shanghai
      - FLASK_HOST=0.0.0.0
      - FLASK_PORT=5000
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - OPENAI_MODEL=${OPENAI_MODEL:-Qwen/Qwen3-14B}
      - OPENAI_WHISPER_MODEL=${OPENAI_WHISPER_MODEL:-Qwen/Qwen3-ASR-1.7B}
    volumes:
      - ./stats:/app/stats
      - ./downloads:/app/downloads
      - ./reminder-data:/app/reminder-data

  mischub-oral:
    build:
      context: .
      dockerfile: Dockerfile
    image: mischub:latest
    container_name: mischub-oral
    restart: unless-stopped
    ports:
      - "127.0.0.1:8504:8504"
    environment:
      - TZ=Asia/Shanghai
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - OPENAI_MODEL=${OPENAI_MODEL:-Qwen/Qwen3-14B}
      - OPENAI_WHISPER_MODEL=${OPENAI_WHISPER_MODEL:-Qwen/Qwen3-ASR-1.7B}
    volumes:
      - ./口语AI伴侣/data:/app/口语AI伴侣/data
    # 口语含流式对话，timeout 放宽；中文目录用 --chdir 进入后按模块名加载
    command: ["gunicorn", "-w", "2", "-b", "0.0.0.0:8504", "--timeout", "300",
              "--chdir", "口语AI伴侣", "app:app"]

  mischub-convert:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    image: mischub-streamlit:latest
    container_name: mischub-convert
    restart: unless-stopped
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      - TZ=Asia/Shanghai
      - MISC_DOWNLOAD_DIR=/app/downloads
    volumes:
      - ./downloads:/app/downloads
    command: >
      streamlit run 格式转换系统/app.py
      --server.port=8501
      --server.address=0.0.0.0
      --server.baseUrlPath=convert
      --server.enableCORS=false
      --server.enableXsrfProtection=false
      --server.maxUploadSize=200
      --browser.gatherUsageStats=false

  mischub-dcf:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    image: mischub-streamlit:latest
    container_name: mischub-dcf
    restart: unless-stopped
    ports:
      - "127.0.0.1:8502:8502"
    environment:
      - TZ=Asia/Shanghai
      - MISC_DOWNLOAD_DIR=/app/downloads
    volumes:
      - ./downloads:/app/downloads
    command: >
      streamlit run DCF估值分析系统/streamlit_app.py
      --server.port=8502
      --server.address=0.0.0.0
      --server.baseUrlPath=dcf
      --server.enableCORS=false
      --server.enableXsrfProtection=false
      --browser.gatherUsageStats=false

  mischub-video:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    image: mischub-streamlit:latest
    container_name: mischub-video
    restart: unless-stopped
    ports:
      - "127.0.0.1:8503:8503"
    environment:
      - TZ=Asia/Shanghai
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - OPENAI_MODEL=${OPENAI_MODEL:-Qwen/Qwen3-14B}
    volumes:
      - ./AI视频制作/data:/app/AI视频制作/data
    command: >
      streamlit run AI视频制作/app.py
      --server.port=8503
      --server.address=0.0.0.0
      --server.baseUrlPath=video
      --server.enableCORS=false
      --server.enableXsrfProtection=false
      --browser.gatherUsageStats=false

  mischub-reminder:
    build:
      context: .
      dockerfile: Dockerfile
    image: mischub:latest
    container_name: mischub-reminder
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      - MISC_REMINDER_DIR=/app/reminder-data
    volumes:
      - ./reminder-data:/app/reminder-data
    command: ["python", "scripts/reminder_worker.py"]
