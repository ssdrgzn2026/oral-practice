name: Deploy MiscHub to Server

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  DEPLOY_PATH: "/opt/oral-practice"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Pack source
        run: |
          git archive --format=tar.gz -o mischub-src.tar.gz HEAD
          chmod 644 mischub-src.tar.gz
          ls -lh mischub-src.tar.gz

      - name: Copy source to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ORAL_HOST }}
          username: ${{ secrets.ORAL_USERNAME }}
          password: ${{ secrets.ORAL_PASSWORD }}
          source: "mischub-src.tar.gz"
          target: "${{ env.DEPLOY_PATH }}"
          overwrite: true

      - name: Build and deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORAL_HOST }}
          username: ${{ secrets.ORAL_USERNAME }}
          password: ${{ secrets.ORAL_PASSWORD }}
          script_timeout: 60m
          script: |
            set -e
            cd ${{ env.DEPLOY_PATH }}

            # 解包源码（保留 .env 与数据目录）
            tar -xzf mischub-src.tar.gz
            rm -f mischub-src.tar.gz

            mkdir -p 口语AI伴侣/data

            # 创建或覆盖环境变量文件
            cat > .env <<EOF
            OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY || '' }}
            OPENAI_BASE_URL=${{ secrets.OPENAI_BASE_URL || 'https://api.openai.com/v1' }}
            OPENAI_MODEL=${{ secrets.OPENAI_MODEL || 'gpt-4o-mini' }}
            OPENAI_WHISPER_MODEL=${{ secrets.OPENAI_WHISPER_MODEL || 'FunAudioLLM/SenseVoiceSmall' }}
            EOF

            # 在服务器上构建镜像并重启服务
            docker compose build
            docker compose up -d --remove-orphans

            # 清理悬空镜像，避免磁盘耗尽
            docker image prune -f || true

            # 等待服务启动
            sleep 8

            # 健康检查
            ok=1
            for target in "5000/" "8501/convert/healthz" "8502/dcf/healthz"; do
              HEALTH=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:${target}" || echo "000")
              echo "健康检查 ${target}: HTTP ${HEALTH}"
              if [ "$HEALTH" != "200" ]; then ok=0; fi
            done

            if [ "$ok" = "1" ]; then
              echo "✅ 部署成功"
              exit 0
            fi

            echo "❌ 健康检查失败，请手动排查"
            docker compose logs --tail=50
            exit 1

      - name: Notify result
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ 部署完成，访问 https://oral.pingxu.xin"
          else
            echo "❌ 部署失败"
          fi
