<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiscHub｜杂具小栈</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="app">
        <header class="header">
            <h1>🧰 MiscHub｜杂具小栈</h1>
            <p class="subtitle">一站式零散工具工作台</p>
        </header>

        <main class="main">
            <div class="module-grid">
                <a class="module-card" href="/oral">
                    <div class="module-icon">🎙️</div>
                    <h2>口语AI伴侣</h2>
                    <p>AI 情景对话、话题独白、影子跟读、每日表达、雅思口语，一站式口语练习。</p>
                    <span class="module-status available">可用</span>
                </a>
                <a class="module-card" href="/convert">
                    <div class="module-icon">🔄</div>
                    <h2>格式转换系统</h2>
                    <p>文件与数据格式互转，文档、图片、音视频等常见格式一键处理。</p>
                    <span class="module-status coming">开发中</span>
                </a>
                <a class="module-card" href="/dcf">
                    <div class="module-icon">📈</div>
                    <h2>DCF 工具</h2>
                    <p>现金流折现估值工具，快速测算企业内在价值。</p>
                    <span class="module-status coming">开发中</span>
                </a>
            </div>
        </main>

        <footer class="footer">
            <p>MiscHub｜杂具小栈 · 一站式零散工具工作台</p>
            <p class="icp">京ICP备2026035074号-1 | 京公网安备11010802048950号</p>
