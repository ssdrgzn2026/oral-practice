<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiscHub｜杂具小栈</title>
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="MiscHub">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="apple-touch-icon" href="/static/img/icon-192.png">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="home-bg">
    <div class="app">
        <header class="header">
            <h1>🧰 MiscHub｜杂具小栈</h1>
            <p class="subtitle">一站式零散工具工作台</p>
        </header>

        <main class="main">
            <div class="module-grid">
                <a class="module-card" href="/oral" data-module="oral">
                    <div class="module-icon">🎙️</div>
                    <h2>口语AI伴侣</h2>
                    <p>AI 情景对话、话题独白、影子跟读、每日表达、雅思口语，一站式口语练习。</p>
                    <span class="module-status available module-count" id="count-oral">·</span>
                </a>
                <a class="module-card" href="/convert/" data-module="convert">
                    <div class="module-icon">🔄</div>
                    <h2>格式转换系统</h2>
                    <p>PDF / Word / 图片 / 音视频等 18+ 种格式互转，本地处理，隐私安全。</p>
                    <span class="module-status available module-count" id="count-convert">·</span>
                </a>
                <a class="module-card" href="/tickets" data-module="tickets">
                    <div class="module-icon">⏰</div>
                    <h2>票务提醒</h2>
                    <p>医院放号、演出开票前 2 分钟微信提醒，可查北京各大医院放号规律。</p>
                    <span class="module-status available module-count" id="count-tickets">·</span>
                </a>
                <a class="module-card" href="/dcf/" data-module="dcf">
                    <div class="module-icon">📈</div>
                    <h2>DCF 工具</h2>
                    <p>现金流折现估值系统，支持两阶段/三阶段模型与敏感性分析。</p>
                    <span class="module-status available module-count" id="count-dcf">·</span>
                </a>
            </div>
        </main>

        <footer class="footer">
            <p>MiscHub｜杂具小栈 · 一站式零散工具工作台</p>
            <p class="icp">京ICP备2026035074号-1 | 京公网安备11010802048950号</p>
        </footer>
    </div>
    <script src="/static/js/track.js"></script>
    <script>
    // 模块使用计数：点击上报 + 展示累计次数
    (function () {
        fetch("/api/card-stats").then(function (r) { return r.json(); }).then(function (d) {
            Object.keys(d).forEach(function (m) {
                var el = document.getElementById("count-" + m);
                if (el) el.textContent = d[m] ? "已用 " + d[m] + " 次" : "·";
            });
        }).catch(function () {});

        document.querySelectorAll(".module-card[data-module]").forEach(function (card) {
            card.addEventListener("click", function () {
                var m = card.dataset.module;
                var el = document.getElementById("count-" + m);
                fetch("/api/card-click", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ module: m }),
                    keepalive: true,
                }).then(function (r) { return r.json(); }).then(function (d) {
                    if (el && d.count) el.textContent = "已用 " + d.count + " 次";
                }).catch(function () {});
            });
        });
    })();
    </script>
    <script src="/static/js/pwa.js"></script>
    <script>
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("/sw.js").catch(function () {});
        }
    </script>
</body>
</html>
