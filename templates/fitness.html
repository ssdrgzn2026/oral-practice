<script>
/* ================= 火柴人动画引擎 =================
 * 侧视图姿态参数（绝对角度，度）：
 *   hipH  髋部高度 0~1（1=站立）
 *   torso 躯干前倾角（0=直立，90=水平躺/俯）
 *   thigh 大腿相对"竖直向下"向前抬的角度
 *   shin  膝弯角（小腿相对大腿向后折）
 *   arm   上臂绝对角（0=垂下，90=前平举，180=举过头顶，负值=向后）
 *   fore  肘弯角（前臂相对上臂向前收）
 * 正视图姿态参数：hipH, knee(膝弯), armOut(手臂侧举角 0=垂下 90=侧平举), elbow(肘弯), lean
 * props: 'barHands'(手持杠铃) 'barBack'(杠铃在肩背) 'barHips' 'bench'(凳子) 'barUp'(头顶横杆)
 */
var CV = null, CTX = null;
function lerp(a,b,t){ return a+(b-a)*t; }
function mixPose(A,B,t){
    var P={};
    for(var k in A) P[k]=(typeof A[k]==='number'&&typeof B[k]==='number')?lerp(A[k],B[k],t):A[k];
    return P;
}
function drawSide(P, W, H){
    var c=CTX, groundY=H*0.88, cx=CV.width*0.42;
    var legL=H*0.30, torsoL=H*0.26, armL=H*0.24, headR=H*0.055;
    var hipY=groundY-legL*P.hipH, hip={x:cx,y:hipY};
    c.strokeStyle='#e8ecff'; c.lineWidth=5; c.lineCap='round'; c.lineJoin='round';
    var rad=Math.PI/180;
    function pt(o,angDeg,len){ var a=angDeg*rad; return {x:o.x+Math.sin(a)*len, y:o.y+Math.cos(a)*len}; }
    function line(a,b){ c.beginPath(); c.moveTo(a.x,a.y); c.lineTo(b.x,b.y); c.stroke(); }
    // 道具先画
    if(P.props==='bench'){ c.strokeStyle='#3d4470'; c.lineWidth=8;
        line({x:cx-50,y:groundY-legL*0.35},{x:cx+120,y:groundY-legL*0.35});
        line({x:cx-30,y:groundY-legL*0.35},{x:cx-30,y:groundY});
        line({x:cx+100,y:groundY-legL*0.35},{x:cx+100,y:groundY});
        c.strokeStyle='#e8ecff'; c.lineWidth=5; }
    if(P.props==='barUp'){ c.strokeStyle='#3d4470'; c.lineWidth=8;
        line({x:cx-30,y:H*0.08},{x:cx+180,y:H*0.08}); c.strokeStyle='#e8ecff'; c.lineWidth=5; }
    // 躯干（torso: 0 直立；越大越向前 +x 倾倒）
    var ta=P.torso*rad;
    var neck={x:hip.x+Math.sin(ta)*torsoL, y:hip.y-Math.cos(ta)*torsoL};
    line(hip,neck);
    // 头
    var head={x:neck.x+Math.sin(ta)*headR*1.4, y:neck.y-Math.cos(ta)*headR*1.4};
    c.beginPath(); c.arc(head.x,head.y,headR,0,7); c.stroke();
    // 腿：大腿角 thigh（0=竖直向下，正=向前抬），膝弯 shin
    var knee=pt(hip, P.thigh, legL*0.52);
    var ankle=pt(knee, P.thigh-P.shin, legL*0.52);
    line(hip,knee); line(knee,ankle);
    // 后侧腿（轻微错开，营造立体感）
    c.strokeStyle='#9aa3d8';
    var knee2=pt(hip, P.thigh-6, legL*0.52), ankle2=pt(knee2, P.thigh-6-P.shin, legL*0.52);
    line(hip,knee2); line(knee2,ankle2);
    c.strokeStyle='#e8ecff';
    // 手臂：从肩关节（neck 下一点）
    var sho={x:neck.x-Math.sin(ta)*6, y:neck.y+Math.cos(ta)*6};
    var ua=(P.arm)*rad;
    var elb={x:sho.x+Math.sin(ua)*armL*0.52, y:sho.y+Math.cos(ua)*armL*0.52};
    var wr={x:elb.x+Math.sin(ua-(P.fore)*rad)*armL*0.52, y:elb.y+Math.cos(ua-(P.fore)*rad)*armL*0.52};
    line(sho,elb); line(elb,wr);
    // 杠铃/器械
    var barProp=(P.props&&P.props.indexOf('bar')===0)?P.props:(P.props2||null);
    if(barProp==='barHands'){ c.strokeStyle='#f4d03f'; c.lineWidth=7;
        line({x:wr.x-34,y:wr.y},{x:wr.x+34,y:wr.y});
        c.fillStyle='#f4d03f';
        c.fillRect(wr.x-40,wr.y-12,8,24); c.fillRect(wr.x+32,wr.y-12,8,24);
        c.strokeStyle='#e8ecff'; c.lineWidth=5; }
    if(barProp==='barBack'){ c.strokeStyle='#f4d03f'; c.lineWidth=7;
        var bp={x:sho.x-Math.sin(ta)*4, y:sho.y+Math.cos(ta)*4};
        var dx=Math.cos(ta), dy=Math.sin(ta);
        line({x:bp.x-dx*40,y:bp.y-dy*40},{x:bp.x+dx*40,y:bp.y+dy*40});
        c.fillStyle='#f4d03f';
        c.fillRect(bp.x-dx*46-4,bp.y-dy*46-12,8,24); c.fillRect(bp.x+dx*46-4,bp.y+dy*46-12,8,24);
        c.strokeStyle='#e8ecff'; c.lineWidth=5; }
    if(barProp==='barHips'){ c.strokeStyle='#f4d03f'; c.lineWidth=7;
        line({x:hip.x-40,y:hip.y},{x:hip.x+40,y:hip.y});
        c.fillStyle='#f4d03f';
        c.fillRect(hip.x-46,hip.y-12,8,24); c.fillRect(hip.x+38,hip.y-12,8,24);
        c.strokeStyle='#e8ecff'; c.lineWidth=5; }
    // 地面
    c.strokeStyle='#2c3260'; c.lineWidth=3;
    line({x:20,y:groundY+6},{x:W-20,y:groundY+6});
}
function drawFront(P, W, H){
    var c=CTX, groundY=H*0.88, cx=CV.width*0.5;
    var legL=H*0.30*(1-P.knee/260), torsoL=H*0.28, armL=H*0.26, headR=H*0.055;
    var hipY=groundY-legL, hip={x:cx,y:hipY};
    var rad=Math.PI/180;
    c.strokeStyle='#e8ecff'; c.lineWidth=5; c.lineCap='round';
    function line(a,b){ c.beginPath(); c.moveTo(a.x,a.y); c.lineTo(b.x,b.y); c.stroke(); }
    var lean=(P.lean||0)*rad;
    var neck={x:hip.x+Math.sin(lean)*torsoL, y:hip.y-Math.cos(lean)*torsoL};
    line(hip,neck);
    c.beginPath(); c.arc(neck.x,neck.y-headR*1.5,headR,0,7); c.stroke();
    // 双腿
    var sp=H*0.045, kb=P.knee*rad*0.5;
    line(hip,{x:cx-sp- Math.sin(kb)*10, y:groundY}); line(hip,{x:cx+sp+Math.sin(kb)*10, y:groundY});
    // 双臂（armOut 0=垂 90=侧平举）
    var ao=P.armOut*rad, eb=(P.elbow||0)*rad;
    [-1,1].forEach(function(s){
        var elb={x:neck.x+s*Math.sin(ao)*armL*0.52, y:neck.y+Math.cos(ao)*armL*0.52};
        var wr={x:elb.x+s*Math.sin(ao-eb*s)*armL*0.52, y:elb.y+Math.cos(ao-eb*s)*armL*0.52};
        line(neck,elb); line(elb,wr);
    });
    c.strokeStyle='#2c3260'; c.lineWidth=3;
    line({x:20,y:groundY+6},{x:W-20,y:groundY+6});
}
/* 动作模板：view + 关键帧循环 */
var TMPL={
    squat:      {view:'side',frames:[{hipH:1,torso:8,thigh:0,shin:6,arm:75,fore:60,props:'barBack'},{hipH:.55,torso:32,thigh:82,shin:82,arm:75,fore:60,props:'barBack'}]},
    bench:      {view:'side',frames:[{hipH:.32,torso:88,thigh:78,shin:88,arm:135,fore:8,props:'bench'},{hipH:.32,torso:88,thigh:78,shin:88,arm:105,fore:70,props:'bench'}],bar:'hands'},
    incline:    {view:'side',frames:[{hipH:.32,torso:60,thigh:78,shin:88,arm:135,fore:8,props:'bench'},{hipH:.32,torso:60,thigh:78,shin:88,arm:105,fore:70,props:'bench'}],bar:'hands'},
    press:      {view:'side',frames:[{hipH:1,torso:4,thigh:0,shin:4,arm:60,fore:75},{hipH:1,torso:4,thigh:0,shin:4,arm:170,fore:6}],bar:'hands'},
    pulldown:   {view:'side',frames:[{hipH:.45,torso:6,thigh:85,shin:90,arm:170,fore:6,props:'bench'},{hipH:.45,torso:12,thigh:85,shin:90,arm:120,fore:65,props:'bench'}],bar:'hands'},
    row:        {view:'side',frames:[{hipH:.8,torso:52,thigh:12,shin:18,arm:20,fore:6},{hipH:.8,torso:52,thigh:12,shin:18,arm:-18,fore:78}],bar:'hands'},
    pushdown:   {view:'side',frames:[{hipH:1,torso:8,thigh:0,shin:4,arm:12,fore:85},{hipH:1,torso:8,thigh:0,shin:4,arm:12,fore:6}]},
    curl:       {view:'side',frames:[{hipH:1,torso:4,thigh:0,shin:4,arm:8,fore:6},{hipH:1,torso:4,thigh:0,shin:4,arm:8,fore:135}],bar:'hands'},
    latraise:   {view:'front',frames:[{hipH:1,knee:4,armOut:12,elbow:8},{hipH:1,knee:4,armOut:85,elbow:8}]},
    fly:        {view:'front',frames:[{hipH:1,knee:6,armOut:100,elbow:20,lean:12},{hipH:1,knee:6,armOut:58,elbow:20,lean:12}]},
    plank:      {view:'side',frames:[{hipH:.3,torso:92,thigh:96,shin:4,arm:88,fore:88}],static:1},
    sideplank:  {view:'front',frames:[{hipH:1,knee:2,armOut:6,elbow:80,lean:38}],static:1},
    rdl:        {view:'side',frames:[{hipH:1,torso:10,thigh:6,shin:10,arm:25,fore:4},{hipH:.92,torso:68,thigh:10,shin:12,arm:35,fore:4}],bar:'hands'},
    lunge:      {view:'side',frames:[{hipH:1,torso:4,thigh:0,shin:4,arm:6,fore:6},{hipH:.62,torso:8,thigh:80,shin:85,arm:6,fore:6}]},
    hipthrust:  {view:'side',frames:[{hipH:.18,torso:55,thigh:75,shin:70,arm:150,fore:20,props:'bench'},{hipH:.42,torso:38,thigh:75,shin:70,arm:55,fore:10,props:'bench'}],bar:'hips'},
    calf:       {view:'side',frames:[{hipH:1,torso:3,thigh:0,shin:2,arm:20,fore:10},{hipH:1.07,torso:3,thigh:0,shin:2,arm:20,fore:10}]},
    crunch:     {view:'side',frames:[{hipH:.32,torso:18,thigh:85,shin:88,arm:150,fore:10},{hipH:.32,torso:52,thigh:85,shin:88,arm:120,fore:30}]},
    legraise:   {view:'side',frames:[{hipH:.98,torso:0,thigh:2,shin:2,arm:175,fore:4,props:'barUp'},{hipH:.98,torso:0,thigh:85,shin:6,arm:175,fore:4,props:'barUp'}]},
    pallof:     {view:'side',frames:[{hipH:1,torso:4,thigh:0,shin:6,arm:60,fore:80},{hipH:1,torso:4,thigh:0,shin:6,arm:88,fore:4}]}
};
/* 官方 3D 演示图（Keep 截图帧，static/img/fitness/），有图的动作优先用图，没有的回退火柴人 */
var IMGCOUNT={bench:3,incline:4,press:4,lat:4,pushdown:4,plank:1,sideplank:1,facepull:4,
              curl:4,hammer:4,squat:2,rdl:2,lunge:4,hipthrust:2,calf:2,crunch:4,legraise:2,pallof:4};
var imgTimer=null, imgFrame=0, imgKey=null;
function startImgCycle(key){
    imgKey=key; imgFrame=0;
    var el=document.getElementById('animImg');
    clearInterval(imgTimer);
    var show=function(){
        el.style.opacity=0;
        setTimeout(function(){
            el.src='/static/img/fitness/'+imgKey+'_'+(imgFrame%IMGCOUNT[imgKey])+'.jpg';
            el.style.opacity=1; imgFrame++;
        }, PL.paused?0:200);
    };
    el.onload=function(){ el.style.opacity=1; };
    show();
    imgTimer=setInterval(function(){ if(!PL.paused) show(); }, REP_MS);
}
function stopImgCycle(){ clearInterval(imgTimer); imgTimer=null; }

/* 动画循环 */
var animOn=false, animT=0, animTmpl=null, animDir=1, REP_MS=1500;
function startAnim(tmpl){
    animTmpl=TMPL[tmpl]; animT=0; animDir=1;
    if(!animOn){ animOn=true; requestAnimationFrame(animLoop); }
}
function animLoop(){
    if(!animOn) return;
    var cv=CV, ctx=CTX;
    ctx.clearRect(0,0,cv.width,cv.height);
    var t=animT;
    var ease=t<.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;
    var P=mixPose(animTmpl.frames[0], animTmpl.frames[animTmpl.frames.length-1], animTmpl.static?0:ease);
    if(animTmpl.bar) P.props2='bar'+animTmpl.bar[0].toUpperCase()+animTmpl.bar.slice(1);
    if(animTmpl.view==='front') drawFront(P,cv.width,cv.height); else drawSide(P,cv.width,cv.height);
    animT+=animDir*16/REP_MS;
    if(animT>=1){animT=1;animDir=-1;} if(animT<=0){animT=0;animDir=1;}
    requestAnimationFrame(animLoop);
}

/* ================= 计划数据（摘自训练计划文档） =================
 * sets 组数, reps "8-10" 或 time 秒（计时类）, rest 组间休息秒, tmpl 动画模板 */
var WARMUP_COMMON={
  list:['跑步机快走 5 分钟（坡度 3–5、速度 5–6 km/h），微微出汗即可',
        '关节活动：肩环绕 ×10、手臂画圈 ×10、髋部环绕 ×10、手腕与踝关节各活动 20 秒',
        '动态拉伸：弓步转体每侧 ×5、站姿体侧屈每侧 ×5（训练前不要静态压腿，会降低力量输出）',
        '目标肌群预组：当天第一个动作用空杆或 50% 重量做 1–2 组 × 10 次，再进入正式组'],
  pits:['不要跳过热身直接上大重量——冬季或早晨肌肉关节温度低，受伤概率明显上升',
        '热身不是训练，预组做到"身体热起来"就停，不要提前消耗体力',
        '完成通用热身后，接着做当天的课前针对性预热，再进入正式组']};
var DAYS=[
{ id:'push', name:'周一 · 推日', sub:'胸 / 肩前中束 / 三头 + 核心',
  warmL:['肩部激活：肩环绕 ×10，再做徒手或弹力带肩外旋 ×15——推类动作对肩关节压力大，肩袖必须先唤醒',
         '胸椎活动：弓步转体每侧 ×5，让上背部能挺得起来',
         '预组：空杆卧推 ×15，再用正式重量的 50% 做 ×8，然后才进入正式组'],
  coolL:['门框胸肌拉伸：前臂抵住门框或龙门架立柱，身体缓慢向前转，感受胸部牵拉',

        +'<b style="font-size:13px;color:#666">通用热身</b>'+ul(WARMUP_COMMON.list)
        +'<b style="font-size:13px;color:#666">课前针对性预热（'+D.name+'）</b>'+ul(D.warmL)
        +'<b style="font-size:13px;color:#c26">避坑提醒</b>'+ul(WARMUP_COMMON.pits)+'</div>';
    D.exs.forEach(function(e,i){
        html+='<div class="ex-card" data-i="'+i+'"><div class="ex-head"><span class="num">'+(i+1)+'</span>'
            +'<span class="nm">'+e.name+'</span>'
            +'<span class="st">'+e.sets+' 组 × '+(e.time? e.time+' 秒':e.reps+' 次')+'｜休 '+e.rest+'s</span></div>'
            +'<p class="ex-focus">重点：'+e.focus+'　·　<span class="keep">Keep 搜「'+e.keep+'」</span></p>'
            +'<div class="ex-detail"><h4>动作要点</h4><ul>'+e.tips.map(function(t){return '<li>'+t+'</li>';}).join('')+'</ul>'
            +'<h4>避坑提醒</h4><ul>'+e.pits.map(function(t){return '<li>'+t+'</li>';}).join('')+'</ul></div></div>';
    });
    html+='<div class="subbox"><h3>🧘 课后拉伸放松（每个动作 20–30 秒 × 2 组）</h3>'
        +ul(D.coolL)+'<b style="font-size:13px;color:#c26">避坑提醒</b>'+ul(D.coolP)+'</div>';

(function initDays(){
    var tabs=document.getElementById('dayTabs');

        var b=document.createElement('button');
        b.className='day-tab'; b.textContent=d.name;
        b.onclick=function(){ curDay=i; renderDay(); };
        tabs.appendChild(b);
    });
    renderDay();
})();

/* ================= 跟练播放器 ================= */
var PL={day:0,ex:0,set:1,phase:'work',remain:0,timer:null,paused:false,tipIdx:0,side:0};
var VOICE=null, speechOK=('speechSynthesis' in window);
function pickVoice(){
    if(!speechOK) return;
    try{
        var vs=speechSynthesis.getVoices();
        VOICE=null;
        for(var i=0;i<vs.length;i++) if(/^zh|中文|Chinese|Mandarin/i.test(vs[i].lang+vs[i].name)){ VOICE=vs[i]; break; }
        if(!VOICE && vs.length) VOICE=vs[0];
    }catch(e){}
}
if(speechOK){ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }

/* 语音三级策略：①服务器 TTS（iOS PWA 可靠）②浏览器语音 ③纯文字提示 */
var serverTTS=null;          // null=未探测 true=可用 false=不可用
var audioQ=[], audioPlaying=false, curAudio=null;
function speak(t){
    if(!document.getElementById('chkVoice').checked) return;
    if(serverTTS===false){ browserSpeak(t); return; }
    audioQ.push(t);
    if(!audioPlaying) playNext();
}
function playNext(){
    var t=audioQ.shift();
    if(t===undefined){ audioPlaying=false; return; }
    audioPlaying=true;
    fetch('/api/fitness-tts',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({text:t})})
    .then(function(r){ if(!r.ok) throw new Error(); return r.blob(); })
    .then(function(b){
        serverTTS=true;
        curAudio=new Audio(URL.createObjectURL(b));
        curAudio.onended=function(){ playNext(); };
        curAudio.onerror=function(){ ttsFail(t); };
        var p=curAudio.play();
        if(p&&p.catch) p.catch(function(){ ttsFail(t); });
    })
    .catch(function(){ ttsFail(t); });
}
function ttsFail(t){
    serverTTS=false; audioPlaying=false; audioQ.length=0;
    browserSpeak(t);
}
function stopVoice(){
    audioQ.length=0;
    if(curAudio){ try{ curAudio.pause(); curAudio=null; }catch(e){} }
    audioPlaying=false;
    if(speechOK) try{ speechSynthesis.cancel(); }catch(e){}
}
function browserSpeak(t){
    if(!speechOK){ showVoiceHint(); return; }
    try{
        speechSynthesis.resume();
        speechSynthesis.cancel();
        var u=new SpeechSynthesisUtterance(t);
        u.lang='zh-CN'; u.rate=1.05;
        if(VOICE) u.voice=VOICE;
        u.onerror=function(){ showVoiceHint(); };
        speechSynthesis.speak(u);
    }catch(e){ showVoiceHint(); }
}
var voiceHinted=false;
function showVoiceHint(){
    if(voiceHinted) return; voiceHinted=true;
    var el=document.getElementById('voiceHint');
    if(el) el.textContent='⚠ 服务器语音与浏览器语音均不可用，已切换为纯文字提示模式';
}
function testVoice(){ speak('语音测试：平板杠铃卧推，第一组，开始'); }
function curEx(){ return DAYS[PL.day].exs[PL.ex]; }
function startPlayer(){
    PL={day:curDay,ex:0,set:1,phase:'work',remain:0,timer:null,paused:false,tipIdx:0,side:0};
    CV=document.getElementById('animCv'); CTX=CV.getContext('2d');
    document.getElementById('player').classList.add('on');
    startExercise();
}
function startExercise(){
    var e=curEx();
    document.getElementById('player').classList.remove('resting');
    document.getElementById('pName').textContent=e.name;
    document.getElementById('pMuscle').textContent='🎯 锻炼部位：'+e.focus;
    document.getElementById('pRestLabel').textContent='';
    document.getElementById('pDone').textContent='✓ 完成本组';
    var cv=document.getElementById('animCv'), im=document.getElementById('animImg');
    if(e.imgs && IMGCOUNT[e.imgs]){
        animOn=false; cv.style.display='none'; im.style.display='block';
        startImgCycle(e.imgs);
    }else{
        stopImgCycle(); im.style.display='none'; cv.style.display='block';
        startAnim(e.tmpl);
    }
    renderTips(e);
    var nxt=DAYS[PL.day].exs[PL.ex+1];
    document.getElementById('pNext').textContent=nxt?('下一个：'+nxt.name+'　'+nxt.sets+' 组 × '+(nxt.time?nxt.time+'秒':nxt.reps+'次')):'这是今天最后一个动作';
    PL.phase='work';
    if(e.time){ PL.remain=e.time;
        speak(e.name+'，第 '+PL.set+' 组，'+e.time+' 秒，开始');
        tick();
    }else{
        setBig(e.reps);
        speak(e.name+'，第 '+PL.set+' 组，'+e.reps.replace('-',' 到 ')+' 次');
        setBig('做 '+e.reps+' 次');
    }
    updateSetInfo();
}
function renderDots(){
    var e=curEx(), d=document.getElementById('pDots'), html='';
    for(var i=1;i<=e.sets;i++)
        html+='<i class="'+(i<PL.set?'done':(i===PL.set?'cur':''))+'"></i>';
    d.innerHTML=html;
}
function renderTips(e){
    var h='<b>动作要点</b><br>'+e.tips.map(function(t,i){return (i+1)+'. '+t;}).join('<br>')
         +'<br><b style="color:#ffb4b4">避坑提醒</b><br>'
         +e.pits.map(function(t){return '<span class="warn">⚠ '+t+'</span>';}).join('<br>');
    document.getElementById('pTip').innerHTML=h;
}
function updateSetInfo(){
    var e=curEx();
    var s='动作 '+(PL.ex+1)+'/'+DAYS[PL.day].exs.length+'　·　第 '+PL.set+' / '+e.sets+' 组';
    if(e.bothSides) s+='（'+(PL.side?'右侧':'左侧')+'）';
    document.getElementById('pSet').textContent=s;
    renderDots();
}
function setBig(t){ document.getElementById('pBig').textContent=t; }
function tick(){
    clearInterval(PL.timer);
    setBig(fmtT(PL.remain));
    PL.timer=setInterval(function(){
        if(PL.paused) return;
        PL.remain--;
        setBig(fmtT(Math.max(0,PL.remain)));
        if(PL.remain<=3&&PL.remain>0) speak(String(PL.remain));
        if(PL.remain<=0){ clearInterval(PL.timer); finishSet(); }
    },1000);
}
function fmtT(s){ return Math.floor(s/60)+':'+('0'+s%60).slice(-2); }
function finishSet(){
    var e=curEx();
    if(e.bothSides && PL.side===0 && curEx().time){ /* 计时双侧：换边再来一次 */
        PL.side=1; PL.remain=e.time; updateSetInfo();
        speak('换另一侧，'+e.time+' 秒，开始'); tick(); return;
    }
    PL.side=0;
    if(PL.set<e.sets){ restPhase(e.rest); }
    else{ nextExercise(); }
}
function restPhase(e){
    PL.phase='rest';
    document.getElementById('player').classList.add('resting');
    document.getElementById('pRestLabel').textContent='组间休息';
    var nxt=DAYS[PL.day].exs[PL.ex+1];
    speak('休息 '+e.rest+' 秒');
    PL.remain=e.rest;
    clearInterval(PL.timer);
    setBig(fmtT(PL.remain));
    PL.timer=setInterval(function(){
        if(PL.paused) return;
        PL.remain--;
        setBig(fmtT(Math.max(0,PL.remain)));
        if(PL.remain===5) speak('准备，'+(PL.set+1<=e.sets?('第 '+(PL.set+1)+' 组'):''));
        if(PL.remain<=0){
            clearInterval(PL.timer);
            PL.set++;
            startExercise();
        }
    },1000);
}
function nextExercise(){
    if(PL.ex<DAYS[PL.day].exs.length-1){ PL.ex++; PL.set=1; PL.side=0; startExercise(); }
    else{
        animOn=false; stopImgCycle(); clearInterval(PL.timer); clearInterval(PL.tipTimer);
        setBig('🎉'); document.getElementById('pName').textContent='今天的训练完成！';
        document.getElementById('pSet').textContent='';
        document.getElementById('pRestLabel').textContent='';
        document.getElementById('pTip').innerHTML='<b>别忘记课后拉伸（每个 20–30 秒 × 2 组）</b><br>'+DAYS[PL.day].coolL.join('<br>');
        document.getElementById('pNext').textContent='';
        speak('今天的训练全部完成，记得做课后拉伸');
    }
}
document.getElementById('btnStart').onclick=startPlayer;
document.getElementById('btnTestVoice').onclick=testVoice;
document.getElementById('pDone').onclick=function(){
    if(PL.phase==='rest'){          // 跳过组间休息，直接开始下一组
        clearInterval(PL.timer);
        PL.set++;
        startExercise();
        return;
    }
    clearInterval(PL.timer);
    speak('完成');
    finishSet();
};
document.getElementById('pPrev').onclick=function(){
    if(PL.ex<=0) { speak('已经是第一个动作'); return; }
    clearInterval(PL.timer);
    PL.ex--; PL.set=1; PL.side=0;
    speak('返回，'+curEx().name);
    startExercise();
};
document.getElementById('pSkip').onclick=function(){
    clearInterval(PL.timer);
    speak('跳过');
    nextExercise();
};
document.getElementById('pPause').onclick=function(){
    PL.paused=!PL.paused;
    this.textContent=PL.paused?'▶ 继续':'⏸ 暂停';
    if(PL.paused){ animOn=false; stopVoice(); } else { animOn=true; requestAnimationFrame(animLoop); }
};
document.getElementById('pExit').onclick=function(){
    animOn=false; stopImgCycle(); stopVoice(); clearInterval(PL.timer); clearInterval(PL.tipTimer);
    document.getElementById('player').classList.remove('on');
};
</script>
<script src="/static/js/track.js"></script>
</body>
</html>
