<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}知识图谱 · MiscHub</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="app">
        <header class="header">
            <h1>{{ icon }} {{ title }}知识图谱</h1>
            <p class="subtitle">从顶层分支逐层深入，💬 随时问 AI 拓展</p>
            <p class="back-home"><a href="/graph">← 返回知识图谱</a>&nbsp;&nbsp;·&nbsp;&nbsp;<a href="/">返回 MiscHub 首页</a></p>
        </header>

        <main class="main">
            <div id="crumbs" class="crumbs"></div>
            <div id="back-bar" class="back-bar" style="display:none;"></div>

            <div class="phy-search">
                <input type="text" id="phy-search" placeholder="🔍 查找知识点，如：熵、黑洞、激光…">
                <div id="phy-search-results"></div>
            </div>

            <div class="card" id="node-info"></div>
            <div id="related-box" class="card" style="display:none;"></div>

            <div class="card" id="demo-box" style="display:none;"></div>

            <div class="panel-header-controls" style="justify-content:center; margin:10px 0;">
                <button id="ai-explain" class="btn primary">💡 AI 深入讲解</button>
                <button id="ai-frontier" class="btn secondary">🔬 最新研究进展</button>
            </div>

            <div id="children" class="module-grid"></div>

            <div id="ai-panel" class="card" style="display:none;">
                <h3 id="ai-title">🤖 AI 解答</h3>
                <div id="ai-output" class="result-text" style="text-align:left;"></div>
                <div class="input-area" style="margin-top:10px;">
                    <input type="text" id="ai-input" placeholder="继续追问这个知识点…">
                    <button id="ai-ask" class="btn primary">提问</button>
                </div>
            </div>

            <div class="card" id="nobel-box" style="display:none;"></div>
        </main>

        <footer class="footer">
            <p>MiscHub｜杂具小栈 · 一站式零散工具工作台</p>
            <p class="icp">京ICP备2026035074号-1 | 京公网安备11010802048950号</p>
        </footer>
    </div>

    <script>
    var SUBJECT = {{ subject | tojson }};
    (function () {
        var tree = null;
        var path = [];  // 当前下钻路径上的节点
        var navStack = [];  // 跨分支跳转的来路（用于返回）

        var crumbs = document.getElementById("crumbs");
        var nodeInfo = document.getElementById("node-info");
        var childrenBox = document.getElementById("children");
        var aiPanel = document.getElementById("ai-panel");
        var aiOutput = document.getElementById("ai-output");
        var aiTitle = document.getElementById("ai-title");

        function cur() { return path.length ? path[path.length - 1] : tree; }

        // 按 id 查找节点链 / 名称
        function findChain(node, id, chain) {
            if (node.id === id) return chain.concat([node]);
            var kids = node.children || [];
            for (var i = 0; i < kids.length; i++) {
                var r = findChain(kids[i], id, chain.concat([node]));
                if (r) return r;
            }
            return null;
        }
        function nameOf(id) {
            var c = findChain(tree, id, []);
            return c ? c[c.length - 1].name : null;
        }

        // 轻量 Markdown 渲染（标题/加粗/列表/分隔线/行内公式）
        var GREEK = { "\\alpha": "α", "\\beta": "β", "\\gamma": "γ", "\\delta": "δ", "\\nu": "ν",
                      "\\lambda": "λ", "\\mu": "μ", "\\pi": "π", "\\rho": "ρ", "\\sigma": "σ",
                      "\\phi": "φ", "\\omega": "ω", "\\Omega": "Ω", "\\Delta": "Δ", "\\hbar": "ħ", "\\theta": "θ" };
        function mdToHtml(md) {
            var s = String(md);
            s = s.replace(/\n\s*\n[\s\n]*/g, "\n\n");  // 连续空行折叠为一个
            // 先转义 HTML
            s = s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
            // 块级公式 $$...$$ 与行内 $...$
            s = s.replace(/\$\$([\s\S]+?)\$\$/g, function (_, f) { return '<div class="md-formula">' + texFix(f) + "</div>"; });
            s = s.replace(/\$([^$\n]+?)\$/g, function (_, f) { return '<code class="md-tex">' + texFix(f) + "</code>"; });
            // 标题
            s = s.replace(/^#### (.+)$/gm, "<h4>$1</h4>")
                 .replace(/^### (.+)$/gm, "<h3 class='md-h'>$1</h3>")
                 .replace(/^## (.+)$/gm, "<h3 class='md-h'>$1</h3>")
                 .replace(/^# (.+)$/gm, "<h3 class='md-h'>$1</h3>");
            // 分隔线
            s = s.replace(/^\s*---+\s*$/gm, "<hr class='md-hr'>");
            // 表格（| a | b | 形式）
            s = s.replace(/(?:^|\n)((?:^\|.*\|.*(?:\n|$))+)/gm, function (m) {
                var rows = m.trim().split("\n").map(function (l) {
                    return l.trim().replace(/^\||\|$/g, "").split("|").map(function (c) { return c.trim(); });
                });
                // 去掉分隔行 |---|---|
                rows = rows.filter(function (r) { return !/^[-: ]+$/.test(r.join("")); });
                if (!rows.length) return m;
                var html = '<div class="md-table-wrap"><table class="md-table">';
                rows.forEach(function (r, ri) {
                    html += ri === 0 ? "<thead><tr>" : "<tr>";
                    r.forEach(function (c) { html += ri === 0 ? "<th>" + c + "</th>" : "<td>" + c + "</td>"; });
                    html += ri === 0 ? "</tr></thead><tbody>" : "</tr>";
                });
                return "\n" + html + "</tbody></table></div>";
            });
            // 无序列表
            s = s.replace(/(?:^|\n)([ \t]*[-*] .+(?:\n[ \t]*[-*] .+)*)/g, function (m) {
                var items = m.trim().split("\n").map(function (l) { return "<li>" + l.replace(/^[ \t]*[-*] /, "") + "</li>"; });
                return "\n<ul class='md-ul'>" + items.join("") + "</ul>";
            });
            // 有序列表
            s = s.replace(/(?:^|\n)([ \t]*\d+\. .+(?:\n[ \t]*\d+\. .+)*)/g, function (m) {
                var items = m.trim().split("\n").map(function (l) { return "<li>" + l.replace(/^[ \t]*\d+\. /, "") + "</li>"; });
                return "\n<ol class='md-ol'>" + items.join("") + "</ol>";
            });
            // 加粗 / 斜体
            s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
                 .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");
            // 段落换行
            s = s.replace(/\n{2,}/g, "<br><br>").replace(/\n/g, "<br>");
            return s;
        }
        function texFix(f) {
            Object.keys(GREEK).forEach(function (k) { f = f.split(k).join(GREEK[k]); });
            return f.replace(/\\times/g, "×").replace(/\\cdot/g, "·").replace(/\\approx/g, "≈")
                    .replace(/\\neq/g, "≠").replace(/\\pm/g, "±").replace(/\\propto/g, "∝")
                    .replace(/\\frac\{([^{}]*)\}\{([^{}]*)\}/g, "($1)/($2)")
                    .replace(/\^\{([^{}]*)\}/g, "<sup>$1</sup>").replace(/\^(\w)/g, "<sup>$1</sup>")
                    .replace(/_\{([^{}]*)\}/g, "<sub>$1</sub>").replace(/_(\w)/g, "<sub>$1</sub>")
                    .replace(/\\/g, "");
        }

        function esc(s) {
            return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
        }

        function render() {
            var node = cur();
            // 跨分支跳转的返回条
            var backBar = document.getElementById("back-bar");
            if (navStack.length) {
                var src = navStack[navStack.length - 1];
                var srcName = src.length ? src[src.length - 1].name : "物理学";
                backBar.style.display = "block";
                backBar.innerHTML = '<a href="#" id="back-link">↩ 返回 ' + esc(srcName) + "</a>";
                document.getElementById("back-link").addEventListener("click", function (e) {
                    e.preventDefault();
                    path = navStack.pop();
                    aiPanel.style.display = "none";
                    render();
                });
            } else {
                backBar.style.display = "none";
            }
            // 面包屑
            var trail = ['<a href="#" data-i="-1" class="crumb">{{ icon }} {{ title }}</a>'];
            path.forEach(function (n, i) {
                trail.push('<span class="crumb-sep">›</span><a href="#" data-i="' + i + '" class="crumb">' + esc(n.name) + "</a>");
            });
            crumbs.innerHTML = trail.join("");
            crumbs.querySelectorAll(".crumb").forEach(function (a) {
                a.addEventListener("click", function (e) {
                    e.preventDefault();
                    var i = parseInt(a.dataset.i, 10);
                    path = i < 0 ? [] : path.slice(0, i + 1);
                    aiPanel.style.display = "none";
                    render();
                });
            });

            // 当前节点信息
            nodeInfo.innerHTML =
                "<h2>" + (node.icon || "📘") + " " + esc(node.name) + "</h2>" +
                "<p style='margin-top:6px;'>" + esc(node.desc || "") + "</p>" +
                (path.length ? "" : "<p class='hint' style='margin-top:6px;'>点击任意分支开始深入；每个知识点旁的 💬 可以随时向 AI 提问</p>");

            // 相关知识点直达（如四种基本力 → 各分支）
            var relBox = document.getElementById("related-box");
            if (node.related && node.related.length) {
                relBox.style.display = "block";
                relBox.innerHTML = "<span class='hint'>📍 在图谱中的位置：</span>" +
                    node.related.map(function (rid) {
                        return '<button class="nobel-chip rel-link" data-id="' + rid + '">' + esc(nameOf(rid) || rid) + "</button>";
                    }).join("");
                relBox.querySelectorAll(".rel-link").forEach(function (b) {
                    b.addEventListener("click", function () {
                        var chain = findChain(tree, b.dataset.id, []);
                        if (chain) {
                            navStack.push(path.slice());  // 记住来路
                            path = chain.filter(function (n) { return n.id; });  // 去掉根节点
                            aiPanel.style.display = "none";
                            render();
                            window.scrollTo({ top: 0, behavior: "smooth" });
                        }
                    });
                });
            } else {
                relBox.style.display = "none";
                relBox.innerHTML = "";
            }

            // 相关诺贝尔奖（聚合本节点及所有子孙节点，按年份排列；可点击展开 AI 详解）
            var nobelBox = document.getElementById("nobel-box");
            var prizes = [];
            (function collect(n) {
                (n.nobel || []).forEach(function (x) { prizes.push(x); });
                (n.children || []).forEach(collect);
            })(node);
            if (prizes.length && path.length > 0) {  // 顶层主页不显示，避免干扰
                prizes.sort(function (a, b) { return a.year - b.year; });
                nobelBox.style.display = "block";
                nobelBox.innerHTML = "<h3>🏅 相关诺贝尔奖（共 " + prizes.length + " 项，点击查看详解）</h3>" +
                    '<div class="nobel-list">' + prizes.map(function (x, i) {
                        return '<div class="nobel-item nobel-link" data-i="' + i + '">' +
                            '<span class="nobel-year">' + x.year + "</span>" +
                            "<b>" + esc(x.who) + "</b><span class='hint'>　" + esc(x.for) + "　→</span></div>";
                    }).join("") + "</div>";
                nobelBox.querySelectorAll(".nobel-link").forEach(function (el) {
                    el.addEventListener("click", function () {
                        showNobelDetail(prizes[+el.dataset.i], prizes, node.name);
                    });
                });
            } else {
                nobelBox.style.display = "none";
                nobelBox.innerHTML = "";
            }

            // 互动演示（PhET 仿真 / 自制 canvas 动画）
            var demoBox = document.getElementById("demo-box");
            window.PhyAnims && window.PhyAnims.stop();
            if (node.demo && node.demo.type === "canvas") {
                demoBox.style.display = "block";
                demoBox.innerHTML =
                    "<h3>🎮 互动演示：" + esc(node.demo.title) + "</h3>" +
                    "<div class='demo-frame-wrap'><canvas id='demo-canvas' style='position:absolute;inset:0;width:100%;height:100%;'></canvas></div>";
                window.PhyAnims && window.PhyAnims.start(node.demo.anim, document.getElementById("demo-canvas"));
            } else if (node.demo) {
                var simUrl = "https://phet.colorado.edu/sims/html/" + node.demo.sim + "/latest/" + node.demo.sim + "_all.html?locale=zh_CN";
                demoBox.style.display = "block";
                demoBox.innerHTML =
                    "<h3>🎮 互动演示：" + esc(node.demo.title) + "</h3>" +
                    "<div class='demo-frame-wrap'><iframe src='" + simUrl + "' allowfullscreen loading='lazy'></iframe></div>" +
                    "<p class='hint'>加载较慢属正常（模拟器来自科罗拉多大学 PhET 项目）。<a href='" + simUrl + "' target='_blank' rel='noopener'>全屏打开 ↗</a></p>";
            } else {
                demoBox.style.display = "none";
                demoBox.innerHTML = "";
            }

            // 子节点
            var kids = node.children || [];
            if (!kids.length) {
                childrenBox.innerHTML = "<p class='hint' style='text-align:center;'>已到最细节知识点，可用上方 AI 按钮继续深入探索</p>";
                return;
            }
            childrenBox.innerHTML = kids.map(function (k, i) {
                return '<div class="module-card phy-card" data-i="' + i + '">' +
                    '<button class="phy-ask" data-i="' + i + '" title="问 AI">💬</button>' +
                    '<div class="module-icon">' + (k.icon || "📖") + "</div>" +
                    "<h2>" + esc(k.name) + "</h2>" +
                    "<p>" + esc(k.desc || "") + "</p>" +
                    (k.children ? '<span class="module-status available">' + k.children.length + ' 个子主题</span>' : '<span class="module-status coming">最细颗粒</span>') +
                    "</div>";
            }).join("");
            childrenBox.querySelectorAll(".phy-card").forEach(function (card) {
                card.addEventListener("click", function (e) {
                    if (e.target.classList.contains("phy-ask")) return;
                    path.push(kids[+card.dataset.i]);
                    aiPanel.style.display = "none";
                    render();
                    window.scrollTo({ top: 0, behavior: "smooth" });
                });
            });
            childrenBox.querySelectorAll(".phy-ask").forEach(function (btn) {
                btn.addEventListener("click", function () {
                    var k = kids[+btn.dataset.i];
                    askAI("请用通俗易懂的语言讲解{{ title }}中的「" + k.name + "」：" + (k.desc || "") +
                          "。包括：核心概念、公式或规律、一个生活中的例子。", "💬 " + k.name);
                });
            });
        }

        // AI 问答（走本站已配置的 /api/chat）
        var chatCtx = [];
        function askAI(prompt, title) {
            aiPanel.style.display = "block";
            aiTitle.textContent = title || "🤖 AI 解答";
            aiOutput.textContent = "思考中…";
            aiPanel.scrollIntoView({ behavior: "smooth" });
            chatCtx = [{ role: "user", content: prompt }];
            fetch("/api/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ messages: chatCtx, max_tokens: 2000 }),
            }).then(function (r) { return r.json(); })
              .then(function (d) {
                  var reply = (d.choices && d.choices[0] && d.choices[0].message && d.choices[0].message.content) || ("出错了：" + (d.error || ""));
                  aiOutput.innerHTML = mdToHtml(reply);
                  chatCtx.push({ role: "assistant", content: reply });
                  var truncated = d.choices && d.choices[0] && d.choices[0].finish_reason === "length";
                  var cb = document.getElementById("ai-continue");
                  if (cb) cb.remove();
                  if (truncated) {
                      var btn = document.createElement("button");
                      btn.id = "ai-continue";
                      btn.className = "btn secondary";
                      btn.style.marginTop = "8px";
                      btn.textContent = "⏩ 回答没写完，点击继续";
                      btn.addEventListener("click", function () {
                          btn.remove();
                          aiOutput.innerHTML += "<p class='hint'>（续写中…）</p>";
                          chatCtx.push({ role: "user", content: "请接着上文继续，不要重复已说过的内容。" });
                          fetch("/api/chat", {
                              method: "POST",
                              headers: { "Content-Type": "application/json" },
                              body: JSON.stringify({ messages: chatCtx, max_tokens: 2000 }),
                          }).then(function (r) { return r.json(); })
                            .then(function (d2) {
                                var more = (d2.choices && d2.choices[0] && d2.choices[0].message && d2.choices[0].message.content) || "";
                                aiOutput.innerHTML = aiOutput.innerHTML.replace("<p class=\"hint\">（续写中…）</p>", "") + mdToHtml(more);
                                chatCtx.push({ role: "assistant", content: more });
                            });
                      });
                      aiOutput.after(btn);
                  }
              })
              .catch(function () { aiOutput.textContent = "网络错误，请重试"; });
        }

        // 诺贝尔奖词条详解：AI 生成介绍 + 同领域相关奖项互链
        function showNobelDetail(prize, allPrizes, fieldName) {
            var others = allPrizes.filter(function (x) { return x !== prize; });
            // 词条区：AI 面板
            var relList = others.map(function (x) { return x.year + "年" + x.who + "（" + x.for + "）"; }).join("；");
            askAI(
                "请简要介绍 " + prize.year + " 年诺贝尔{{ prize }}（获奖人：" + prize.who + "，获奖成果：" + prize.for + "）：" +
                "1. 获奖工作的背景与核心内容；2. 它对「" + fieldName + "」领域的贡献和长远影响；" +
                "3. 它与哪些其他诺贝尔{{ prize }}有承接或关联关系（可参考：" + relList + "），请说明关联是什么。",
                "🏅 " + prize.year + " 年 · " + prize.who
            );
            // 相关奖项互链 chips（放在 AI 面板标题下）
            if (others.length) {
                var chips = document.createElement("div");
                chips.className = "nobel-chips";
                chips.innerHTML = "<span class='hint'>相关奖项：</span>" + others.map(function (x) {
                    var i = allPrizes.indexOf(x);
                    return '<button class="nobel-chip" data-i="' + i + '">' + x.year + " " + esc(x.who) + "</button>";
                }).join("");
                var old = aiPanel.querySelector(".nobel-chips");
                if (old) old.remove();
                aiTitle.after(chips);
                chips.querySelectorAll(".nobel-chip").forEach(function (b) {
                    b.addEventListener("click", function () {
                        showNobelDetail(allPrizes[+b.dataset.i], allPrizes, fieldName);
                    });
                });
            }
        }

        document.getElementById("ai-ask").addEventListener("click", function () {
            var q = document.getElementById("ai-input").value.trim();
            if (!q) return;
            document.getElementById("ai-input").value = "";
            aiOutput.textContent = "思考中…";
            chatCtx.push({ role: "user", content: q });
            fetch("/api/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ messages: chatCtx, max_tokens: 2000 }),
            }).then(function (r) { return r.json(); })
              .then(function (d) {
                  var reply = (d.choices && d.choices[0] && d.choices[0].message && d.choices[0].message.content) || ("出错了：" + (d.error || ""));
                  aiOutput.innerHTML = mdToHtml(reply);
                  chatCtx.push({ role: "assistant", content: reply });
              })
              .catch(function () { aiOutput.textContent = "网络错误，请重试"; });
        });

        document.getElementById("ai-explain").addEventListener("click", function () {
            var n = cur();
            askAI("请系统深入地讲解「" + n.name + "」：" + (n.desc || "") +
                  "。要求：1. 核心概念与历史背景；2. 关键公式及含义；3. 重要实验或证据；4. 一个生活化例子。", "💡 " + n.name + " · 深入讲解");
        });
        document.getElementById("ai-frontier").addEventListener("click", function () {
            var n = cur();
            askAI("请介绍「" + n.name + "」领域的最新研究进展和前沿动态，包括近几年的重要实验、发现或 Nobel 奖相关成果。" +
                  "如果某些信息可能超出你的知识截止时间，请明确标注。", "🔬 " + n.name + " · 研究前沿");
        });

        fetch("/api/graph-map/" + SUBJECT)
            .then(function (r) { return r.json(); })
            .then(function (d) { tree = d; render(); })
            .catch(function () { nodeInfo.innerHTML = "<p class='hint'>知识图谱加载失败，请刷新</p>"; });

        // ========== 模糊查找（任意层级可用，搜全树） ==========
        var flatIndex = [];  // {node, chain}
        function buildIndex() {
            flatIndex = [];
            (function walk(n, chain) {
                if (n !== tree) flatIndex.push({ node: n, chain: chain.slice() });
                (n.children || []).forEach(function (c) { walk(c, chain.concat([c])); });
            })(tree, []);
        }
        // 模糊匹配：查询字符按顺序出现即可（支持间隔），优先子串命中
        function fuzzy(q, text) {
            text = text.toLowerCase();
            if (text.includes(q)) return 2;
            var i = 0;
            for (var j = 0; j < text.length && i < q.length; j++) {
                if (text[j] === q[i]) i++;
            }
            return i === q.length ? 1 : 0;
        }
        var searchInput = document.getElementById("phy-search");
        var searchResults = document.getElementById("phy-search-results");
        searchInput.addEventListener("input", function () {
            var q = searchInput.value.trim().toLowerCase();
            if (!q || !tree) { searchResults.innerHTML = ""; searchResults.style.display = "none"; return; }
            if (!flatIndex.length) buildIndex();
            var hits = flatIndex
                .map(function (e) {
                    return { e: e, score: fuzzy(q, e.node.name.toLowerCase()) * 2 + fuzzy(q, (e.node.desc || "").toLowerCase()) };
                })
                .filter(function (x) { return x.score > 0; })
                .sort(function (a, b) { return b.score - a.score; })
                .slice(0, 10);
            if (!hits.length) {
                searchResults.innerHTML = "<div class='phy-hit hint'>没有匹配的知识点</div>";
            } else {
                searchResults.innerHTML = hits.map(function (x, i) {
                    var trail = x.e.chain.map(function (n) { return n.name; }).join(" › ");
                    return '<div class="phy-hit" data-i="' + flatIndex.indexOf(x.e) + '">' +
                        "<b>" + esc(x.e.node.name) + "</b><span class='hint'>　" + esc(trail) + "</span></div>";
                }).join("");
                searchResults.querySelectorAll(".phy-hit").forEach(function (el) {
                    el.addEventListener("click", function () {
                        var entry = flatIndex[+el.dataset.i];
                        navStack.push(path.slice());  // 记住来路
                        path = entry.chain;
                        aiPanel.style.display = "none";
                        render();
                        searchInput.value = "";
                        searchResults.style.display = "none";
                        window.scrollTo({ top: 0, behavior: "smooth" });
                    });
                });
            }
            searchResults.style.display = "block";
        });
        document.addEventListener("click", function (e) {
            if (!e.target.closest(".phy-search")) searchResults.style.display = "none";
        });
    })();
    </script>
    <script src="/static/js/phy_anims.js"></script>
    <script src="/static/js/track.js"></script>
</body>
</html>
