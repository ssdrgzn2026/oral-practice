<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网站导航 · MiscHub</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="app">
        <header class="header">
            <h1>🧭 网站导航</h1>
            <p class="subtitle">精选网站一站直达</p>
            <p class="back-home"><a href="/">← 返回 MiscHub 首页</a></p>
        </header>

        <main class="main" id="portal-main">
        </main>

        <footer class="footer">
            <p>MiscHub｜杂具小栈 · 一站式零散工具工作台</p>
            <p class="icp">京ICP备2026035074号-1 | 京公网安备11010802048950号</p>
        </footer>
    </div>

    <script>
    fetch("/api/links")
        .then(function (r) { return r.json(); })
        .then(function (data) {
            var main = document.getElementById("portal-main");
            main.innerHTML = data.categories.map(function (cat) {
                var sites = cat.sites.map(function (s) {
                    return '<a class="module-card site-card" href="' + s.url + '" target="_blank" rel="noopener">' +
                        '<div class="module-icon">' + (s.icon || "🔗") + "</div>" +
                        "<h2>" + s.name + ' <span class="site-go">↗</span></h2>' +
                        "<p>" + s.desc + "</p>" +
                        "</a>";
                }).join("");
                return '<section class="portal-cat"><h2 class="portal-cat-title">' +
                    (cat.icon || "") + " " + cat.name + '</h2>' +
                    '<div class="module-grid">' + sites + "</div></section>";
            }).join("");
        })
        .catch(function () {
            document.getElementById("portal-main").innerHTML = "<p class='hint'>加载失败，请刷新重试</p>";
        });
    </script>
    <script src="/static/js/track.js"></script>
</body>
</html>
