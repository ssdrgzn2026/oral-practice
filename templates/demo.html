<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>演示器 · 杂具小栈</title>
<link rel="stylesheet" href="/static/css/style.css">
<link rel="stylesheet" href="/static/css/demo.css">
</head>
<body class="demo-body home-bg">
<div class="demo-wrap">
    <div class="demo-head">
        <h1>🎓 演示器</h1>
        <p>可视化演示 + 代码填空闯关，边看边学边验收</p>
        <a class="backlink" href="/">← 返回杂具小栈首页</a>
    </div>
    <div class="panel">
        <h2>选择一个演示器进入</h2>
        <p class="hint">每个演示器都分两步：先看可视化演示理解原理，再通过代码填空闯关验收。</p>
        <div class="demo-cards">
            <a class="module-card" href="/demo/graph">
                <div class="module-icon">🕸️</div>
                <h2>图的邻接矩阵存储</h2>
                <p>数据结构：无向图的增删点边操作与内存中 0/1 矩阵的同步变化。</p>
            </a>
            <a class="module-card" href="/demo/cnn">
                <div class="module-icon">🍜</div>
                <h2>CNN 食物图像分类</h2>
                <p>深度学习：卷积神经网络逐层提取特征，完成 11 类食物分类。</p>
            </a>
            <a class="module-card" href="/demo/fitness">
                <div class="module-icon">🏋️</div>
                <h2>推拉腿健身跟练</h2>
                <p>一周三练推拉腿计划：动作动画演示 + 组数/休息倒计时 + 语音播报。</p>
            </a>
        </div>
    </div>
</div>
<script src="/static/js/track.js"></script>
</body>
</html>
